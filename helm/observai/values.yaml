image:
  api:
    repository: observai/observai-api
    tag: v0.1.0
  web:
    repository: observai/observai-web
    tag: v0.1.0

api:
  replicas: 1
  port: 8080

web:
  replicas: 1
  port: 3000

config:
  env: self-hosted
  mode: local
  timezone: Local
  appEnv: self-hosted
  logLevel: info
  publicUrl: https://observai.example.com
  allowedOrigins: https://observai.example.com
  trustProxy: "true"
  browserApiUrl: /api/observai
  apiUrl: http://observai-api:8080
  redisUrl: redis://observai-redis:6379/0
  migrateOnStart: "true"
  migrationsDir: /app/migrations

secrets:
  databaseUrl: postgres://observai:change-me@observai-postgres:5432/observai?sslmode=disable
  postgresDb: observai
  postgresUser: observai
  postgresPassword: change-me
  jwtSecret: change-me-local-jwt-secret-minimum-32-bytes
  encryptionKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

ingress:
  enabled: true
  className: ""
  host: observai.example.com
  tls: []

postgres:
  enabled: true
  storage: 10Gi

redis:
  enabled: true
  storage: 2Gi
