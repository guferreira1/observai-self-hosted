{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: observai-postgres
spec:
  selector:
    app: observai-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: observai-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observai-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observai-postgres
  template:
    metadata:
      labels:
        app: observai-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: observai-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: observai-postgres-data
{{- end }}
