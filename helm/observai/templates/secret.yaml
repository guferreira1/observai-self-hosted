apiVersion: v1
kind: Secret
metadata:
  name: observai-secrets
type: Opaque
stringData:
  OBSERVAI_DATABASE_DSN: {{ .Values.secrets.databaseUrl | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  OBSERVAI_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  OBSERVAI_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
