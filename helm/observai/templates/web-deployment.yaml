apiVersion: apps/v1
kind: Deployment
metadata:
  name: observai-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: observai-web
  template:
    metadata:
      labels:
        app: observai-web
    spec:
      containers:
        - name: observai-web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          ports:
            - containerPort: {{ .Values.web.port }}
          envFrom:
            - configMapRef:
                name: observai-config
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 20
            periodSeconds: 20
