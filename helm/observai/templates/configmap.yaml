apiVersion: v1
kind: ConfigMap
metadata:
  name: observai-config
data:
  OBSERVAI_ENV: {{ .Values.config.env | quote }}
  OBSERVAI_MODE: {{ .Values.config.mode | quote }}
  OBSERVAI_TIMEZONE: {{ .Values.config.timezone | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  OBSERVAI_PUBLIC_URL: {{ .Values.config.publicUrl | quote }}
  OBSERVAI_ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  TRUST_PROXY: {{ .Values.config.trustProxy | quote }}
  NEXT_PUBLIC_APP_NAME: "ObservAI"
  NEXT_PUBLIC_APP_ENV: {{ .Values.config.appEnv | quote }}
  NEXT_PUBLIC_OBSERVAI_API_URL: {{ .Values.config.browserApiUrl | quote }}
  OBSERVAI_API_URL: {{ .Values.config.apiUrl | quote }}
  OBSERVAI_REDIS_URL: {{ .Values.config.redisUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  OBSERVAI_MIGRATE_ON_START: {{ .Values.config.migrateOnStart | quote }}
  OBSERVAI_MIGRATIONS_DIR: {{ .Values.config.migrationsDir | quote }}
