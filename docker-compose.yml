services:
  observai-api:
    image: ${OBSERVAI_API_IMAGE}:${OBSERVAI_API_VERSION}
    container_name: observai-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${OBSERVAI_API_PORT}:8080"
    networks:
      - observai

  observai-web:
    image: ${OBSERVAI_WEB_IMAGE}:${OBSERVAI_WEB_VERSION}
    container_name: observai-web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - observai-api
    ports:
      - "${OBSERVAI_WEB_PORT}:3000"
    networks:
      - observai

  postgres:
    image: postgres:16-alpine
    container_name: observai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - observai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observai

  redis:
    image: redis:7-alpine
    container_name: observai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - observai_redis_data:/data
    networks:
      - observai

networks:
  observai:
    name: observai

volumes:
  observai_postgres_data:
  observai_redis_data:
