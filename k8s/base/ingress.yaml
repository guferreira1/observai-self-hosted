apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observai
  namespace: observai
spec:
  rules:
    - host: observai.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: observai-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: observai-web
                port:
                  number: 3000
