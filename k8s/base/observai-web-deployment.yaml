apiVersion: apps/v1
kind: Deployment
metadata:
  name: observai-web
  namespace: observai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observai-web
  template:
    metadata:
      labels:
        app: observai-web
    spec:
      containers:
        - name: observai-web
          image: observai/observai-web:v0.1.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: observai-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
