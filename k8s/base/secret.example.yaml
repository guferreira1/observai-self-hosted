apiVersion: v1
kind: Secret
metadata:
  name: observai-secrets
  namespace: observai
type: Opaque
stringData:
  OBSERVAI_DATABASE_DSN: "REPLACE_WITH_POSTGRES_DSN"
  POSTGRES_DB: "REPLACE_WITH_POSTGRES_DB"
  POSTGRES_USER: "REPLACE_WITH_POSTGRES_USER"
  POSTGRES_PASSWORD: "REPLACE_WITH_POSTGRES_PASSWORD"
  OBSERVAI_JWT_SECRET: "REPLACE_WITH_STRONG_JWT_SECRET"
  OBSERVAI_ENCRYPTION_KEY: "REPLACE_WITH_64_CHARACTER_HEX_ENCRYPTION_KEY"
