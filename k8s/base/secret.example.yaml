apiVersion: v1
kind: Secret
metadata:
  name: observai-secrets
  namespace: observai
type: Opaque
stringData:
  DATABASE_URL: "postgres://observai:change-me@observai-postgres:5432/observai?sslmode=disable"
  POSTGRES_DB: "observai"
  POSTGRES_USER: "observai"
  POSTGRES_PASSWORD: "change-me"
  JWT_SECRET: "change-me"
  REFRESH_TOKEN_SECRET: "change-me"
  ENCRYPTION_KEY: "change-me-32-byte-minimum-secret"
