apiVersion: v1
kind: Secret
metadata:
  name: observai-secrets
  namespace: observai
type: Opaque
stringData:
  OBSERVAI_DATABASE_DSN: "postgres://observai:change-me@observai-postgres:5432/observai?sslmode=disable"
  # Optional compatibility alias for tooling/scripts.
  DATABASE_URL: "postgres://observai:change-me@observai-postgres:5432/observai?sslmode=disable"
  OBSERVAI_REDIS_URL: "redis://observai-redis:6379/0"
  # Optional compatibility alias for tooling/scripts.
  REDIS_URL: "redis://observai-redis:6379/0"
  POSTGRES_DB: "observai"
  POSTGRES_USER: "observai"
  POSTGRES_PASSWORD: "change-me"
  JWT_SECRET: "change-me"
  REFRESH_TOKEN_SECRET: "change-me"
  ENCRYPTION_KEY: "change-me-32-byte-minimum-secret"
